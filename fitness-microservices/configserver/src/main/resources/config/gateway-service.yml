server:
  port: 8080

spring:
  application:
    name: gateway-service
  redis:
    host: sweet-skunk-173793.upstash.io
    port: 6379
    username: default
    password: ${REDIS_PASSWORD}
    ssl:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://lemur-18.cloud-iam.com/auth/realms/fitness-app-1/protocol/openid-connect/certs
          issuer-uri: https://lemur-18.cloud-iam.com/auth/realms/fitness-app-1
  cloud:
    config:
      allowOverride: true
      overrideNone: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                deny-empty-key: true
        - id: activity-service
          uri: lb://ACTIVITY-SERVICE
          predicates:
            - Path=/api/v1/activities/**
        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/v1/recommendations/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
