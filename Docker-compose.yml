
x-service-defaults: &service-defaults
  volumes:
    - ./certs/kafka.truststore.jks:/certs/kafka.truststore.jks:ro
  env_file:
    - .env
  environment: &common-env
    SPRING_CONFIG_IMPORT: "configserver:http://configserver:8888"
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: "/certs/kafka.truststore.jks"
  depends_on:
    - configserver
    - eureka
  restart: on-failure
  networks:
    - fitness-network

services:
  eureka:
    image: chinu12345/fitness-eureka:latest
    platform: linux/amd64
    restart: on-failure
    networks:
      - fitness-network

  configserver:
    image: chinu12345/fitness-config:latest
    platform: linux/amd64
    restart: on-failure
    networks:
      - fitness-network

  userservice:
    <<: *service-defaults
    image: chinu12345/fitness-user:latest
    platform: linux/amd64

  emailservice:
    <<: *service-defaults
    image: chinu12345/fitness-email:latest
    platform: linux/amd64

  aiservice:
    <<: *service-defaults
    image: chinu12345/fitness-ai:latest
    platform: linux/amd64

  activityservice:
    <<: *service-defaults
    image: chinu12345/fitness-activity:latest
    platform: linux/amd64

  gatewayservice:
    <<: *service-defaults
    image: chinu12345/fitness-gateway:latest
    platform: linux/amd64
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./fitness-frontend
      dockerfile: Dockerfile
    image: chinu12345/fitness-frontend:latest
    platform: linux/amd64
    container_name: fitness-frontend
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  fitness-network:
    driver: bridge
